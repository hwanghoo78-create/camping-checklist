<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>영월 월례회 & MT 준비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --canvas:#F4EFE2; --canvas-line:#E3DAC5; --ink:#26301F; --forest:#1F2E23;
    --ember:#D9713C; --ember-dark:#B85A2A;
    --income:#2E7D53; --income-bg:#E3F1E8;
    --expense:#B04A4A; --expense-bg:#F6E4E4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--canvas); font-family:'Work Sans',sans-serif; color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .header{
    background:var(--forest); color:#F4EFE2; padding:22px 18px 16px; position:relative; overflow:hidden;
  }
  .header::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:6px;
    background:repeating-linear-gradient(90deg, var(--ember) 0 14px, transparent 14px 22px); opacity:0.8;
  }
  .header h1{ font-family:'Fraunces',serif; font-weight:700; font-size:22px; margin:0 0 4px; }
  .header p{ margin:0; font-size:12.5px; opacity:0.75; display:flex; align-items:center; gap:6px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:#8a8477; display:inline-block; flex-shrink:0; }
  .dot.live{ background:#5BC98A; box-shadow:0 0 0 0 rgba(91,201,138,0.6); animation:pulse 1.8s infinite; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(91,201,138,0.5); }
    70%{ box-shadow:0 0 0 6px rgba(91,201,138,0); }
    100%{ box-shadow:0 0 0 0 rgba(91,201,138,0); }
  }
  .progress-wrap{ margin-top:14px; }
  .progress-bar{ height:8px; background:rgba(255,255,255,0.18); border-radius:99px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--ember); border-radius:99px; transition:width .3s ease; }
  .progress-label{ font-size:11.5px; margin-top:6px; opacity:0.8; }

  .tab-bar{
    display:flex; gap:8px; overflow-x:auto; padding:12px 12px 4px;
    -webkit-overflow-scrolling:touch; background:var(--forest);
  }
  .tab-bar::-webkit-scrollbar{ display:none; }
  .tab{
    flex:0 0 auto; padding:9px 14px; border-radius:999px;
    font-family:'Fraunces',serif; font-weight:600; font-size:13px;
    color:#fff; opacity:0.5; cursor:pointer; white-space:nowrap;
    display:flex; align-items:center; gap:6px; transition:opacity .15s;
  }
  .tab.active{ opacity:1; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
  .tab .tab-count{ font-family:'Work Sans',sans-serif; font-weight:500; font-size:10.5px; opacity:0.85; }
  .tab-add{
    background:transparent !important; color:#F4EFE2 !important; opacity:0.85 !important;
    border:1.5px dashed rgba(244,239,226,0.5);
  }

  .wrap{ padding:14px 12px 40px; max-width:640px; margin:0 auto; }

  .cat-panel{ border-radius:14px; border:1px solid var(--canvas-line); background:#fff; overflow:hidden; }
  .cat-panel-head{ display:flex; align-items:center; justify-content:space-between; padding:14px; color:#fff; gap:10px; }
  .cat-panel-head .name-block{ font-family:'Fraunces',serif; font-weight:700; font-size:18px; flex:1; min-width:0; word-break:break-word; }
  .head-icons{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    background:rgba(255,255,255,0.22); border:none; color:#fff;
    width:30px; height:30px; border-radius:9px; font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .cat-panel-body{ padding:12px; }

  .item-row{ display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:9px; background:var(--row-bg,#F8F6EF); }
  .item-row + .item-row{ margin-top:6px; }

  .check{
    width:21px; height:21px; min-width:21px; border-radius:50%;
    border:2px solid var(--dot,#999); display:flex; align-items:center; justify-content:center;
    cursor:pointer; background:#fff; flex-shrink:0;
  }
  .check.checked{ background:var(--dot,#999); }
  .check svg{ width:12px; height:12px; opacity:0; }
  .check.checked svg{ opacity:1; }

  .item-text{ flex:1; font-size:14.5px; word-break:break-word; cursor:text; padding:2px 0; }
  .item-text.checked{ text-decoration:line-through; opacity:0.45; }
  .item-edit-input{
    flex:1; border:1px solid var(--ember); border-radius:7px; padding:6px 8px;
    font-size:14.5px; font-family:'Work Sans',sans-serif; background:#fff;
  }

  .amount-input{
    width:88px; text-align:right; border:1px solid var(--canvas-line); border-radius:7px;
    padding:5px 7px; font-size:13.5px; font-family:'Work Sans',sans-serif;
  }
  .amount-input:focus{ outline:2px solid var(--ember); }

  .del-btn{ width:26px; height:26px; border:none; background:transparent; color:#B0A99A; font-size:17px; cursor:pointer; flex-shrink:0; }
  .del-btn:hover{ color:var(--expense); }

  .add-row{ display:flex; gap:8px; margin-top:9px; }
  .add-row input[type=text]{
    flex:1; border:1px solid var(--canvas-line); border-radius:9px; padding:9px 11px;
    font-size:14px; font-family:'Work Sans',sans-serif; background:#FBFAF5;
  }
  .add-row input:focus{ outline:2px solid var(--ember); }
  .add-row button{
    border:none; background:var(--ember); color:#fff; border-radius:9px; padding:0 16px;
    font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .add-row button:active{ background:var(--ember-dark); }

  .empty-hint{ font-size:13px; color:#B0A99A; padding:8px 4px; }
  .empty-state{ text-align:center; padding:40px 20px; color:#9c9584; font-family:'Fraunces',serif; }

  .finance-toggle{ display:flex; border:1px solid var(--canvas-line); border-radius:9px; overflow:hidden; margin-bottom:8px; }
  .finance-toggle button{
    flex:1; padding:9px 0; border:none; background:#FBFAF5; font-size:13px; font-weight:700; cursor:pointer;
    color:#8a8477; font-family:'Work Sans',sans-serif;
  }
  .finance-toggle button.sel-income{ background:var(--income-bg); color:var(--income); }
  .finance-toggle button.sel-expense{ background:var(--expense-bg); color:var(--expense); }

  .finance-summary{ display:flex; gap:8px; margin-top:10px; }
  .sum-box{ flex:1; border-radius:10px; padding:10px; text-align:center; }
  .sum-box .l{ font-size:11.5px; color:#8a8477; margin-bottom:2px; }
  .sum-box .v{ font-size:15px; font-weight:700; font-family:'Fraunces',serif; }
  .sum-box.income-box{ background:var(--income-bg); }
  .sum-box.income-box .v{ color:var(--income); }
  .sum-box.expense-box{ background:var(--expense-bg); }
  .sum-box.expense-box .v{ color:var(--expense); }

  .balance-box{
    margin-top:8px; padding:13px; border-radius:10px; background:#26301F0d;
    display:flex; justify-content:space-between; align-items:baseline; border:1px dashed var(--canvas-line);
  }
  .balance-box .label{ font-size:12.5px; color:#8a8477; }
  .balance-box .value{ font-size:19px; font-weight:700; font-family:'Fraunces',serif; }
  .balance-box .value.positive{ color:var(--income); }
  .balance-box .value.negative{ color:var(--expense); }

  .type-badge{ font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:99px; flex-shrink:0; }
  .type-badge.income{ background:var(--income); color:#fff; }
  .type-badge.expense{ background:var(--expense); color:#fff; }

  .sync-note{ text-align:center; font-size:11.5px; color:#9c9584; margin-top:10px; padding-bottom:4px; line-height:1.5; }

  .loading-screen{
    position:fixed; inset:0; background:var(--canvas);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    font-family:'Fraunces',serif; color:var(--forest); z-index:99;
  }
  .loading-screen.hide{ display:none; }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div>🚌</div>
  <div>연결 중...</div>
</div>

<div class="header">
  <h1>🚌 영월 월례회 &amp; MT 준비</h1>
  <p><span class="dot" id="liveDot"></span><span id="liveLabel">연결 중...</span></p>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0 완료 (0%)</div>
  </div>
</div>

<div class="tab-bar" id="tabBar"></div>
<div class="wrap" id="panelWrap"></div>

<script>
/* ====== Firebase (기존 프로젝트 재사용) ====== */
const firebaseConfig = {
  apiKey: "AIzaSyA9uHi1Myi1ubA2PFwbq--4KcHvjHg1IhM",
  authDomain: "camping-checklist-fd1b0.firebaseapp.com",
  projectId: "camping-checklist-fd1b0",
  storageBucket: "camping-checklist-fd1b0.firebasestorage.app",
  messagingSenderId: "493498746527",
  appId: "1:493498746527:web:528b73c2c51b5aa16b84aa"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const DOC_REF = db.collection('yeongwol_mt').doc('checklist');

const PALETTE = [
  {color:'#3B6E5C', bg:'#E7F0EA'}, {color:'#4A7FA8', bg:'#E7EFF5'},
  {color:'#A15C3B', bg:'#F5E9DF'}, {color:'#B4901F', bg:'#F6EFD8'},
  {color:'#7A5C8A', bg:'#EFE8F2'}, {color:'#2E7D6B', bg:'#E3F1EC'},
  {color:'#7D5A29', bg:'#F1E7D5'}, {color:'#5B6E8C', bg:'#E7EBF3'},
  {color:'#8C4B6B', bg:'#F3E4EC'}, {color:'#4A7050', bg:'#E6F0E8'},
];

let state = null;
let selectedId = null;
let editing = null; // {catId, itemId}
let addFinanceType = 'expense';
let suppressNextSnapshot = false;

function uid(){ return Math.random().toString(36).slice(2,9); }

function defaultState(){
  return {
    categories: [
      { id:'gear', name:'⛺ 준비물', color:PALETTE[0].color, bg:PALETTE[0].bg, type:'simple',
        items:[ {id:uid(),text:'명찰/이름표',checked:false}, {id:uid(),text:'프로젝터·노트북',checked:false}, {id:uid(),text:'구급함',checked:false} ] },
      { id:'transport', name:'🚗 차량/이동', color:PALETTE[1].color, bg:PALETTE[1].bg, type:'simple',
        items:[ {id:uid(),text:'차량 배차 확인',checked:false}, {id:uid(),text:'출발 시간/장소 공지',checked:false} ] },
      { id:'lodge', name:'🏠 숙소', color:PALETTE[2].color, bg:PALETTE[2].bg, type:'simple',
        items:[ {id:uid(),text:'숙소 예약 확인',checked:false}, {id:uid(),text:'방 배정',checked:false}, {id:uid(),text:'침구/이불 확인',checked:false} ] },
      { id:'meal', name:'🍽 식사/간식', color:PALETTE[3].color, bg:PALETTE[3].bg, type:'simple',
        items:[ {id:uid(),text:'저녁 식사 예약',checked:false}, {id:uid(),text:'간식·음료',checked:false} ] },
      { id:'program', name:'📋 진행물품', color:PALETTE[4].color, bg:PALETTE[4].bg, type:'simple',
        items:[ {id:uid(),text:'월례회 안건 자료',checked:false}, {id:uid(),text:'레크레이션 준비물',checked:false} ] },
      { id:'finance', name:'💰 회비(수입/지출)', color:PALETTE[5].color, bg:PALETTE[5].bg, type:'finance', items:[] },
    ]
  };
}

/* ====== Firestore ====== */
auth.signInAnonymously().catch(err=>{
  document.getElementById('liveLabel').textContent = '연결 실패 - 새로고침 해주세요';
  console.error(err);
});

auth.onAuthStateChanged(user=>{
  if(!user) return;
  DOC_REF.onSnapshot(async (snap)=>{
    document.getElementById('loadingScreen').classList.add('hide');
    document.getElementById('liveDot').classList.add('live');
    document.getElementById('liveLabel').textContent = '실시간 연결됨 - 다같이 체크 중';

    if(suppressNextSnapshot){ suppressNextSnapshot = false; return; }

    if(snap.exists){
      state = snap.data().payload;
    } else {
      state = defaultState();
      await DOC_REF.set({ payload: state, updatedAt: Date.now() });
    }
    if(!selectedId && state.categories.length) selectedId = state.categories[0].id;
    editing = null;
    render();
  }, (err)=>{
    console.error(err);
    document.getElementById('liveLabel').textContent = '연결 오류 - 새로고침 해주세요';
  });
});

async function saveState(){
  suppressNextSnapshot = true;
  try{ await DOC_REF.set({ payload: state, updatedAt: Date.now() }); }
  catch(e){ console.error('저장 실패', e); suppressNextSnapshot = false; }
}

/* ====== 카테고리 관리 ====== */
function selectTab(id){ selectedId = id; editing = null; render(); }

function addCategory(){
  const name = prompt('새 카테고리 이름을 입력하세요 (예: 안전/비상)');
  if(!name || !name.trim()) return;
  const palette = PALETTE[state.categories.length % PALETTE.length];
  const cat = { id:uid(), name:name.trim(), color:palette.color, bg:palette.bg, type:'simple', items:[] };
  state.categories.push(cat);
  selectedId = cat.id;
  saveState();
  render();
}

function renameCategory(catId){
  const cat = state.categories.find(c=>c.id===catId);
  if(!cat) return;
  const name = prompt('카테고리 이름 수정', cat.name);
  if(name === null) return;
  if(!name.trim()) return;
  cat.name = name.trim();
  saveState();
  render();
}

function deleteCategory(catId){
  const cat = state.categories.find(c=>c.id===catId);
  if(!cat) return;
  if(!confirm(`"${cat.name}" 카테고리를 삭제할까요? 안의 항목도 모두 사라져요.`)) return;
  state.categories = state.categories.filter(c=>c.id!==catId);
  if(selectedId === catId){
    selectedId = state.categories.length ? state.categories[0].id : null;
  }
  saveState();
  render();
}

/* ====== 항목 관리 ====== */
function getCat(catId){ return state.categories.find(c=>c.id===catId); }

function addItem(catId){
  const inputId = `add-${catId}`;
  const input = document.getElementById(inputId);
  const text = input.value.trim();
  if(!text) return;
  const cat = getCat(catId);
  const item = { id: uid(), text, checked:false };
  if(cat.type === 'finance'){
    item.amount = 0;
    item.type = addFinanceType;
  }
  cat.items.push(item);
  input.value = '';
  saveState();
  render();
  setTimeout(()=>document.getElementById(inputId)?.focus(), 30);
}

function toggleItem(catId, id){
  const cat = getCat(catId);
  const it = cat.items.find(i=>i.id===id);
  if(it) it.checked = !it.checked;
  saveState();
  render();
}

function deleteItem(catId, id){
  const cat = getCat(catId);
  cat.items = cat.items.filter(i=>i.id!==id);
  saveState();
  render();
}

function updateAmount(catId, id, value){
  const cat = getCat(catId);
  const it = cat.items.find(i=>i.id===id);
  if(it) it.amount = Number(value) || 0;
  saveState();
}

function startEdit(catId, itemId){
  editing = { catId, itemId };
  render();
  setTimeout(()=>{
    const el = document.getElementById('edit-input');
    if(el){ el.focus(); el.select(); }
  }, 20);
}

function commitEdit(catId, itemId, value){
  const cat = getCat(catId);
  const it = cat.items.find(i=>i.id===itemId);
  const trimmed = value.trim();
  if(it && trimmed) it.text = trimmed;
  editing = null;
  saveState();
  render();
}

function cancelEdit(){ editing = null; render(); }

function setFinanceType(type){ addFinanceType = type; render(); }

/* ====== 카운트/집계 ====== */
function catCounts(cat){
  const total = cat.items.length;
  const done = cat.items.filter(i=>i.checked).length;
  return {total, done};
}

function overallCounts(){
  let total=0, done=0;
  state.categories.forEach(cat=>{
    if(cat.type === 'finance') return; // 회비는 진행률에서 제외
    const c = catCounts(cat);
    total += c.total; done += c.done;
  });
  return {total, done};
}

/* ====== 렌더링 ====== */
function escapeHTML(str){
  const d = document.createElement('div');
  d.innerText = str;
  return d.innerHTML;
}

function itemRowHTML(catId, item, color, bg, financeType){
  const isEditing = editing && editing.catId===catId && editing.itemId===item.id;
  const checkedClass = item.checked ? 'checked' : '';
  const dotColor = financeType === 'income' ? 'var(--income)' : financeType === 'expense' ? 'var(--expense)' : color;
  const rowBg = financeType === 'income' ? 'var(--income-bg)' : financeType === 'expense' ? 'var(--expense-bg)' : bg;

  const textPart = isEditing
    ? `<input id="edit-input" class="item-edit-input" value="${escapeHTML(item.text)}"
        onkeydown="if(event.key==='Enter'){this.blur();} if(event.key==='Escape'){cancelEdit();}"
        onblur="commitEdit('${catId}', '${item.id}', this.value)">`
    : `<div class="item-text ${checkedClass}" onclick="startEdit('${catId}', '${item.id}')">${escapeHTML(item.text)}</div>`;

  const badge = financeType ? `<span class="type-badge ${financeType}">${financeType==='income'?'수입':'지출'}</span>` : '';
  const amountField = (getCat(catId).type === 'finance')
    ? `<input class="amount-input" type="number" inputmode="numeric" placeholder="금액" value="${item.amount||''}"
        onchange="updateAmount('${catId}', '${item.id}', this.value)">`
    : '';

  return `
    <div class="item-row" style="--row-bg:${rowBg}">
      <div class="check ${checkedClass}" style="--dot:${dotColor}"
        onclick="toggleItem('${catId}', '${item.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      ${badge}
      ${textPart}
      ${amountField}
      <button class="del-btn" onclick="deleteItem('${catId}', '${item.id}')">✕</button>
    </div>`;
}

function addRowHTML(catId, color){
  const inputId = `add-${catId}`;
  return `
    <div class="add-row">
      <input type="text" id="${inputId}" placeholder="항목 추가..."
        onkeydown="if(event.key==='Enter') addItem('${catId}')">
      <button style="background:${color}" onclick="addItem('${catId}')">추가</button>
    </div>`;
}

function renderTabBar(){
  const tabBar = document.getElementById('tabBar');
  tabBar.innerHTML = state.categories.map(cat=>{
    const c = catCounts(cat);
    const active = cat.id === selectedId ? 'active' : '';
    return `
      <div class="tab ${active}" style="background:${cat.color}" onclick="selectTab('${cat.id}')">
        <span>${escapeHTML(cat.name)}</span>
        <span class="tab-count">${cat.type==='finance' ? cat.items.length+'건' : `${c.done}/${c.total}`}</span>
      </div>`;
  }).join('') + `<div class="tab tab-add" onclick="addCategory()">＋ 카테고리</div>`;
}

function renderPanel(){
  const wrap = document.getElementById('panelWrap');
  const cat = getCat(selectedId);

  if(!cat){
    wrap.innerHTML = `<div class="empty-state">카테고리가 없어요.<br>위에서 "＋ 카테고리"를 눌러 추가해보세요.</div>`;
    return;
  }

  const headIcons = `
    <div class="head-icons">
      <button class="icon-btn" onclick="renameCategory('${cat.id}')" title="이름 수정">✏️</button>
      <button class="icon-btn" onclick="deleteCategory('${cat.id}')" title="카테고리 삭제">🗑</button>
    </div>`;

  let body = '';

  if(cat.type === 'finance'){
    const income = cat.items.filter(i=>i.type==='income');
    const expense = cat.items.filter(i=>i.type==='expense');
    const totalIncome = income.reduce((s,i)=>s+(Number(i.amount)||0),0);
    const totalExpense = expense.reduce((s,i)=>s+(Number(i.amount)||0),0);
    const balance = totalIncome - totalExpense;
    const sortedItems = [...income, ...expense];

    body = `
      ${sortedItems.length ? sortedItems.map(i=>itemRowHTML(cat.id, i, cat.color, cat.bg, i.type)).join('') : `<div class="empty-hint">아직 수입/지출 내역이 없어요</div>`}

      <div class="finance-toggle" style="margin-top:10px">
        <button class="${addFinanceType==='income'?'sel-income':''}" onclick="setFinanceType('income')">＋ 수입 추가</button>
        <button class="${addFinanceType==='expense'?'sel-expense':''}" onclick="setFinanceType('expense')">－ 지출 추가</button>
      </div>
      <div class="add-row">
        <input type="text" id="add-${cat.id}" placeholder="${addFinanceType==='income'?'수입 항목 (예: 회비 입금)':'지출 항목 (예: 숙소비 결제)'}"
          onkeydown="if(event.key==='Enter') addItem('${cat.id}')">
        <button style="background:${addFinanceType==='income'?'var(--income)':'var(--expense)'}" onclick="addItem('${cat.id}')">추가</button>
      </div>

      <div class="finance-summary">
        <div class="sum-box income-box"><div class="l">총 수입</div><div class="v">${totalIncome.toLocaleString()}원</div></div>
        <div class="sum-box expense-box"><div class="l">총 지출</div><div class="v">${totalExpense.toLocaleString()}원</div></div>
      </div>
      <div class="balance-box">
        <span class="label">잔액 (수입−지출)</span>
        <span class="value ${balance>=0?'positive':'negative'}">${balance>=0?'+':''}${balance.toLocaleString()}원</span>
      </div>`;

  } else {
    const items = cat.items;
    body = `
      ${items.length ? items.map(i=>itemRowHTML(cat.id, i, cat.color, cat.bg)).join('') : `<div class="empty-hint">아직 항목이 없어요</div>`}
      ${addRowHTML(cat.id, cat.color)}`;
  }

  wrap.innerHTML = `
    <div class="cat-panel">
      <div class="cat-panel-head" style="background:${cat.color}">
        <div class="name-block">${escapeHTML(cat.name)}</div>
        ${headIcons}
      </div>
      <div class="cat-panel-body">${body}</div>
    </div>
    <div class="sync-note">💡 여기서 체크·추가·수정하면 링크를 연 모든 사람 화면에 실시간으로 반영돼요</div>`;
}

function render(){
  if(!state) return;
  const oc = overallCounts();
  const pct = oc.total ? Math.round((oc.done/oc.total)*100) : 0;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = `${oc.done} / ${oc.total} 완료 (${pct}%)`;
  renderTabBar();
  renderPanel();
}
</script>
</body>
</html>
